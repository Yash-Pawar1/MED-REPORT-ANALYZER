findings:
  keywords:
    - "diagnosed"
    - "positive"
    - "negative"
    - "elevated"
    - "reduced"
    - "abnormal"
    - "normal"
    - "detected"
    - "prescribed"
    - "recommended"
    - "history of"
    - "suffering from"
    - "increased"
    - "decreased"
    - "high"
    - "low"

negation:
  pre_negation_triggers:
    - "no"
    - "not"
    - "without"
    - "denies"
    - "denied"
    - "negative for"
    - "absent"
    - "no evidence of"
    - "rules out"
    - "ruled out"
    - "free of"
    - "never had"
    - "unremarkable for"
  post_negation_triggers:
    - "was negative"
    - "is negative"
    - "ruled out"
    - "not observed"
    - "absent"
    - "denied"
  historical_triggers:
    - "history of"
    - "past history"
    - "previously had"
    - "former"
    - "prior history"
    - "prior history of"
    - "diagnosed in the past"
    - "previous"
