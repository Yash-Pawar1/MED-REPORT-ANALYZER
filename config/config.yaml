# Medical Document NLP Analyzer Configuration
# Note: Do NOT store secrets/API keys here. Use .env for secrets.

document_processing:
  supported_file_types:
    - ".pdf"
    - ".txt"
  max_file_size_mb: 10

llm:
  default_provider: "gemini"
  gemini:
    default_model: "gemini-2.5-flash"
  openai:
    default_model: "gpt-4o-mini"
  timeout_seconds: 30
  temperature: 0.0
  max_output_tokens: 1024

report_validation:
  required_sections:
    - "MEDICAL DOCUMENT SUMMARY"
    - "Symptoms:"
    - "Medical Conditions:"
    - "Medications:"
    - "Dosages:"
    - "Tests:"
    - "Procedures:"
    - "Body Parts:"
    - "Important Findings:"
    - "Brief Summary:"
    - "Potential Missing Information:"
    - "Safety Note:"

nlp_vocabulary:
